; SpaceTracker — Who's in space + orbital tracker
; LilyGo T-Display S3 AMOLED (RM67162, 536x240 landscape)

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbmodem1101
lib_deps =
    mathertel/OneButton@^2.0.3
    bblanchon/ArduinoJson@^7.0.0
    hopperpop/Sgp4@^1.0.0
    olikraus/U8g2@^2.35.0
    ; Pinned to 1.4.x — newer versions (1.6+) require an ESP32 core header
    ; (esp32-hal-periman.h) we don't have on the platform pinned by this repo.
    moononournation/GFX Library for Arduino@~1.4.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I./src
board_build.arduino.memory_type = qio_opi
